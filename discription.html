<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discription</title>
    <link rel="stylesheet" href="discript.css">
</head>
<body>
    <body>

        <div class="back">
        <a href="index.html">
      <img src="images/angle-left-solid (1).svg" alt="back">
    </div>
    </a>

    <main class="product-page">
    <div class="product-container">

        <div class="product-image">
            <img id="product-image" src="" alt="">
        </div>

        <div class="product-info">
            <h1 id="product-title"></h1>

            <p class="rating">
                ⭐ <span id="product-rating"></span>
            </p>

            <h2 id="product-price"></h2>

            <p class="brand">
                <strong>Brand:</strong>
                <span id="product-brand"></span>
            </p>

            <p class="category">
                <strong>Category:</strong>
                <span id="product-category"></span>
            </p>

            <p id="product-description"></p>
            <div class="sizes">
                

                <div class="ai-fit-box" id="ai-fit-box">
    <h3>✨ AI Fit Recommendation</h3>

    <div class="fit-info">
        <span>Recommended Size</span>
        <strong id="recommended-size"></strong>
    </div>

    <div class="fit-info">
        <span>Fit Confidence</span>
        <strong>98%</strong>
    </div>

    <p id="fit-message"></p>
</div>

                <h3>Choose Size</h3>
                <button class="btn">S</button>
                <button class="btn">M</button>
                <button class="btn">L</button>
                <button class="btn">XL</button>
            </div>

            <button class="add-cart">
                Add to Cart
            </button>
        </div>
    </div>
</main>

<p id="recommended-size"></p>

<script src="discription.js"></script>

</body>
</body>
</html>
