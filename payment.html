<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>
    <link rel="stylesheet" href="payment.css"/>
  </head>
  <body>

   <button class="back-circle" onclick="history.back()">
    &#8592;
</button>

    <div class="checkout-container">
      <div class="payment-form">
        <h1>Checkout</h1>

        <div class="input-box">
          <label>Full Name</label>
          <input type="text" placeholder="Enzo C3" />
        </div>

        <div class="input-box">
          <label>Email</label>
          <input type="email" placeholder="example@gmail.com" />
        </div>

        <div class="input-box">
          <label>Shipping Address</label>
          <input type="text" placeholder="Enter your address" />
        </div>

        <div class="row">
          <div class="input-box">
            <label>City</label>
            <input type="text" />
          </div>

          <div class="input-box">
            <label>State</label>
            <input type="text" />
          </div>
        </div>

        <h2>Payment Details</h2>

        <div class="input-box">
          <label>Card Number</label>
          <input type="text" placeholder="1234 5678 9012 3456" />
        </div>

        <div class="row">
          <div class="input-box">
            <label>Expiry</label>
            <input type="text" placeholder="MM/YY" />
          </div>

          <div class="input-box">
            <label>CVV</label>
            <input type="password" placeholder="***" />
          </div>
        </div>
      </div>

      <div class="order-summary">
        <h2>Order Summary</h2>

        <div id="checkout-products">
        </div>

        <div class="summary">
          <p>
            <span>Subtotal</span>
            <span id="subtotal">$0</span>
          </p>

          <p>
            <span>Shipping</span>
            <span>$10</span>
          </p>

          <hr />

          <p class="total">
            <span>Total</span>
            <span id="total">$10</span>
          </p>
        </div>

        <button class="pay-btn">Complete Payment</button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
