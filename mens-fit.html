<main class="fit-page">

    <div class="fit-container">

        <a href="find-fit.html" class="back-fit">
            ← Back
        </a>


        <div class="fit-header">

            <span>AVIT MEN'S FIT</span>

            <h1>Find Your Fit</h1>

            <p>
                Enter your measurements and we'll recommend
                the right size for you.
            </p>

        </div>


        <form id="men-fit-form" class="fit-form">


            <!-- HEIGHT -->

            <div class="form-group">

                <label>
                    Height
                </label>

                <div class="height-fields">

                    <div>
                        <input
                            type="number"
                            id="height-feet"
                            placeholder="5"
                            min="3"
                            max="8"
                        >

                        <span>ft</span>
                    </div>

                    <div>
                        <input
                            type="number"
                            id="height-inches"
                            placeholder="10"
                            min="0"
                            max="11"
                        >

                        <span>in</span>
                    </div>

                </div>

                <small
                    class="error-message"
                    id="height-error"
                ></small>

            </div>


            <!-- WEIGHT -->

            <div class="form-group">

                <label for="weight">
                    Weight
                    <span>kg</span>
                </label>

                <input
                    type="number"
                    id="weight"
                    placeholder="e.g. 72"
                    min="20"
                    max="300"
                    step="0.1"
                >

                <small
                    class="error-message"
                    id="weight-error"
                ></small>

            </div>


            <!-- CHEST -->

            <div class="form-group">

                <label for="chest">
                    Chest
                    <span>inches</span>
                </label>

                <input
                    type="number"
                    id="chest"
                    placeholder="e.g. 40"
                    min="20"
                    max="70"
                    step="0.5"
                >

                <small
                    class="error-message"
                    id="chest-error"
                ></small>

            </div>


            <!-- WAIST -->

            <div class="form-group">

                <label for="waist">
                    Waist
                    <span>inches</span>
                </label>

                <input
                    type="number"
                    id="waist"
                    placeholder="e.g. 34"
                    min="20"
                    max="70"
                    step="0.5"
                >

                <small
                    class="error-message"
                    id="waist-error"
                ></small>

            </div>


            <!-- FIT -->

            <div class="form-group">

                <label for="fit">
                    Preferred Fit
                </label>

                <select id="fit">

                    <option value="">
                        Select your preferred fit
                    </option>

                    <option value="Slim">
                        Slim
                    </option>

                    <option value="Regular">
                        Regular
                    </option>

                    <option value="Relaxed">
                        Relaxed
                    </option>

                    <option value="Oversized">
                        Oversized
                    </option>

                </select>

                <small
                    class="error-message"
                    id="fit-error"
                ></small>

            </div>


            <button type="submit" class="find-fit-btn">
                Find My Fit
                <span>→</span>
            </button>
        </form>


        <!-- RESULT -->

        <div
            id="fit-result"
            class="fit-result hidden"
        ></div>

    </div>
