       <section class="fit-section">
    <div class="fit-container">

        <h2>Find Your Perfect Fit</h2>

        <form id="fit-form">

            <!-- Height -->
            <div class="form-group">
                <label for="height">Height</label>
                <input type="number" id="height" name="height" placeholder="Enter your height (cm)">
            </div>

            <!-- Weight -->
            <div class="form-group">
                <label for="weight">Weight</label>
                <input type="number" id="weight" name="weight" placeholder="Enter your weight (kg)">
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender</label>

                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>
                </div>
            </div>

            <!-- Chest -->
            <div class="form-group">
                <label for="chest">Chest</label>
                <input type="number" id="chest" name="chest" placeholder="Chest measurement (cm)">
            </div>

            <!-- Waist -->
            <div class="form-group">
                <label for="waist">Waist</label>
                <input type="number" id="waist" name="waist" placeholder="Waist measurement (cm)">
            </div>

            <!-- Hip -->
            <div class="form-group">
                <label for="hip">Hip</label>
                <input type="number" id="hip"
                    name="hip" placeholder="Hip measurement (cm)">
            </div>

            <!-- Shoulder -->
            <div class="form-group">
                <label for="shoulder">Shoulder Width</label>
                <input type="number" id="shoulder" name="shoulder" placeholder="Shoulder width (cm)">
            </div>

            <!-- Preferred Fit -->
            <div class="form-group">
                <label>Preferred Fit</label>

                <div class="radio-group">

                    <label class="radio-option">
                        <input type="radio" name="fit" value="slim">
                        Slim
                    </label>

                    <label class="radio-option">
                        <input
                            type="radio"
                            name="fit"
                            value="regular">
                        Regular
                    </label>

                    <label class="radio-option">
                        <input
                            type="radio"
                            name="fit"
                            value="oversized">
                        Oversized
                    </label>

                </div>
            </div>

            <button type="submit" class="find-size-btn" id="find-size-btn">
                Find My Size
            </button>
            <div id="ai-result"></div>
        </form>
    </div>
</section>
